name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned device build. Sideloadly (or AltStore) re-signs it with your Apple ID on install.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PracticeRoom.xcodeproj \
            -scheme PracticeRoom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PracticeRoom.app Payload/
          zip -qry PracticeRoom.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeRoom-ipa
          path: PracticeRoom.ipa
          retention-days: 14
